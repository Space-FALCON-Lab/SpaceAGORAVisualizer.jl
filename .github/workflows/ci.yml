name: Visualizer CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node test/unit/visualization/viewer_channels_models_tests.mjs
      - run: node test/unit/visualization/viewer_links_tests.mjs
      - run: python3 -m unittest discover -s test/scripts -p 'test_*.py' -v
      - run: python3 viewer/build_standalone.py --textures none --out "${{ runner.temp }}/viewer.html"
